server:
  port: ${PORT:8000}
  address: 0.0.0.0

spring:
  application:
    name: autotuning-backend
  threads:
    virtual:
      enabled: true
  # Nao usamos spring.datasource.* diretamente porque DATABASE_URL vem no
  # formato libpq (postgresql://user:pass@host:port/db), nao no formato JDBC
  # (jdbc:postgresql://...) que o Spring Boot autoconfigura sozinho — ver
  # config.DatabaseUrlParser + config.DataSourceConfig, que constroem o
  # DataSource manualmente a partir de app.database-url.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

app:
  # Caminho da raiz do repositorio "pipeline" (Python) - onde ficam os
  # scripts cli/*.py, os logs de execucao e o lock file do runner.
  pipeline-root: ${PIPELINE_ROOT:../Autotuning-PostgreSQL-Pipeline}
  # Connection string do Postgres de controle (fila + resultados),
  # formato libpq - mesma variavel de ambiente e mesmo default que o
  # repositorio Pipeline usa (ver utils/db.py la).
  database-url: ${DATABASE_URL:postgresql://autotuning:autotuning@localhost:5433/autotuning_queue}
  cors:
    # "*" e adequado so para desenvolvimento local - em qualquer deployment
    # real isso deve ser restrito a origem exata do frontend.
    allowed-origins: "*"

logging:
  level:
    com.autotuning.backend: INFO
